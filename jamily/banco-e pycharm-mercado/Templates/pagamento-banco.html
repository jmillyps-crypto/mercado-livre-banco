  <h2>Novo cartão de crédito ou pré-pago</h2>
    <form action="/cadastrar_cartao" method="post">

        <label>Número do Cartao</label>
        <input type="text" id="numero" name="numero" placeholder="0000 0000 0000 0000" required>

        <label>Nome do Titular</label>
        <input type="text" id="nome-titular" name="nome" placeholder="Ex: José Marcos" required>

        <div class="lado">
                    <label>Vencimento</label>
                    <input type="date" id="vencimento" name="vencimento" required >

                    <label>Código de Segurança</label>
                    <input type="text" id="codigo" name="codigo"  placeholder="000" maxlength="3" minlength="3" required >

        </div>

        <label>CPF</label>
        <input type="text" id="cpf" name="cpf" maxlength="15" placeholder="Ex:000.000.000-00" required >
    </form>
    <a href="{{ url_for('mensagem') }}"><button type="submit" class="bnt">Pagar e Finalizar</button></a>

</body>
</html>
